name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pinned.txt
          pip install -e ".[dev]"

      - name: Reject hand-committed notebooks
        run: |
          # .ipynb is a build artifact here, never a source file. See
          # docs/notebooks.md for why. colab/ is generated by render-notebooks.
          if git ls-files '*.ipynb' | grep -v '^colab/' | grep . ; then
            echo ""
            echo "The files above are .ipynb outside colab/."
            echo "Notebooks are committed as .py (jupytext percent format)."
            echo "Convert with:  jupytext --to py:percent your_notebook.ipynb"
            exit 1
          fi
          echo "No stray notebooks."

      - name: Verify colab/ matches the sources
        run: |
          # Notebooks are generated from the .py sources by
          # scripts/render_notebooks.py, which produces byte-identical output
          # for identical input. CI re-renders and fails if the committed
          # notebooks differ - it does not generate them, because a bot commit
          # would land on the PR head without triggering a CI run and leave the
          # required status check missing forever.
          python scripts/render_notebooks.py
          if ! git diff --quiet colab; then
            echo ""
            echo "colab/ is out of date. Run this locally and commit the result:"
            echo ""
            echo "    python scripts/render_notebooks.py"
            echo ""
            git diff --stat colab
            exit 1
          fi
          echo "colab/ is current."

      - name: Lint
        run: ruff check tudquant data-pipelines

      - name: Unit tests
        run: pytest -q

      - name: Smoke test (offline)
        env:
          TUDQUANT_DATA_ROOT: ${{ github.workspace }}/_data
          TUDQUANT_SMOKE_OFFLINE: "1"
        run: |
          jupytext --to notebook notebooks/smoke_test.py -o /tmp/smoke.ipynb
          jupyter nbconvert --to notebook --execute /tmp/smoke.ipynb --output /tmp/smoke_out.ipynb
