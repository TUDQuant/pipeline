name: update-data

# Times are UTC. 23:15 is comfortably after the US equity close (21:00 UTC in
# summer, 22:00 in winter) and before anyone in Darmstadt opens a notebook.
on:
  schedule:
    - cron: "15 23 * * 1-5"   # equities + macro, weekdays
    - cron: "30 0 * * *"      # crypto, every day
  workflow_dispatch:
    inputs:
      group:
        description: "Which group to refresh"
        default: "all"
        type: choice
        options: [all, equities, crypto, macro]

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pinned.txt
          pip install -e .

      - name: Refresh
        env:
          TUDQUANT_DATA_ROOT: ${{ github.workspace }}/_data
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          GROUP="${{ github.event.inputs.group }}"
          if [ -z "$GROUP" ]; then
            # Scheduled run: the 00:30 cron only does crypto.
            if [ "${{ github.event.schedule }}" = "30 0 * * *" ]; then GROUP=crypto; else GROUP=all; fi
          fi
          python data-pipelines/update_data.py --group "$GROUP"

      - name: Upload quality summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality
          path: _data/quality/
          retention-days: 14
