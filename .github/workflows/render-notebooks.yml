name: render-notebooks

# Members open notebooks in Colab with one click, which needs a real .ipynb.
# Contributors edit .py. This job is the bridge.
#
# It renders on the PULL REQUEST BRANCH, not on main. That matters: main is
# protected, and a bot pushing directly to it is blocked by the ruleset (and
# should be). Rendering here means the generated notebooks travel with the
# source change that produced them, get reviewed together, and merge together.
on:
  pull_request:
    paths:
      - "curriculum/**.py"
      - "notebooks/**.py"
  # Manual trigger, for re-rendering a branch after the sources and colab/
  # have drifted apart.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR branch itself, not the merge commit, so we can
          # push back to it.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jupytext

      - name: Render
        run: |
          mkdir -p colab
          for f in curriculum/*.py notebooks/*.py; do
            [ -e "$f" ] || continue
            jupytext --to notebook "$f" -o "colab/$(basename "${f%.py}").ipynb"
          done

      - name: Commit to the branch
        run: |
          git config user.name  "tud-quant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add colab
          if git diff --staged --quiet; then
            echo "colab/ already matches the sources - nothing to do."
            exit 0
          fi
          git commit -m "chore: render notebooks [skip ci]"
          git push origin HEAD
