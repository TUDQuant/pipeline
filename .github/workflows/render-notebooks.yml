name: render-notebooks

# Members open notebooks in Colab with one click, which needs a real .ipynb.
# Contributors edit .py. This job is the bridge: it regenerates colab/ from
# curriculum/ on every merge so nobody ever hand-edits a notebook.
on:
  push:
    branches: [main]
    paths:
      - "curriculum/**.py"
      - "notebooks/**.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install jupytext

      - name: Render
        run: |
          mkdir -p colab
          for f in curriculum/*.py notebooks/*.py; do
            [ -e "$f" ] || continue
            jupytext --to notebook "$f" -o "colab/$(basename "${f%.py}").ipynb"
          done

      - name: Commit
        run: |
          git config user.name  "tud-quant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add colab
          git diff --staged --quiet || git commit -m "chore: render notebooks [skip ci]"
          git push
