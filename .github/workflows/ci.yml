name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pinned.txt
          pip install -e ".[dev]"

      - name: Reject hand-committed notebooks
        run: |
          # .ipynb is a build artifact here, never a source file. See
          # docs/notebooks.md for why. colab/ is generated by render-notebooks.
          if git ls-files '*.ipynb' | grep -v '^colab/' | grep . ; then
            echo ""
            echo "The files above are .ipynb outside colab/."
            echo "Notebooks are committed as .py (jupytext percent format)."
            echo "Convert with:  jupytext --to py:percent your_notebook.ipynb"
            exit 1
          fi
          echo "No stray notebooks."

      - name: Verify colab/ matches the sources
        run: |
          # colab/*.ipynb is generated from curriculum/ and notebooks/ by
          # jupytext. CI does NOT generate it - a bot commit would land on the
          # PR head without triggering a CI run, leaving the required check
          # missing and the PR permanently unmergeable. So CI verifies instead:
          # you render locally, CI proves you did.
          mkdir -p colab
          for f in curriculum/*.py notebooks/*.py; do
            [ -e "$f" ] || continue
            jupytext --to notebook "$f" -o "colab/$(basename "${f%.py}").ipynb"
          done
          if ! git diff --quiet colab; then
            echo ""
            echo "colab/ is out of date with the .py sources. Run this locally,"
            echo "then commit the result:"
            echo ""
            echo '  for f in curriculum/*.py notebooks/*.py; do'
            echo '    jupytext --to notebook "$f" -o "colab/$(basename "${f%.py}").ipynb"'
            echo '  done'
            echo ""
            git diff --stat colab
            exit 1
          fi
          echo "colab/ is current."

      - name: Lint
        run: ruff check tudquant data-pipelines

      - name: Unit tests
        run: pytest -q

      - name: Smoke test (offline)
        env:
          TUDQUANT_DATA_ROOT: ${{ github.workspace }}/_data
          TUDQUANT_SMOKE_OFFLINE: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          jupytext --to notebook notebooks/smoke_test.py -o /tmp/smoke.ipynb
          jupyter nbconvert --to notebook --execute /tmp/smoke.ipynb --output /tmp/smoke_out.ipynb
