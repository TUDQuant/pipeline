[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tudquant"
version = "0.1.0"
description = "TUD Quant club data layer and utilities"
readme = "README.md"
requires-python = ">=3.10"  # Colab runs 3.12 - never cap below it
license = { text = "MIT" }

# Loose here so the package installs anywhere. The exact versions the club
# runs on are in requirements-pinned.txt, which is what Colab and CI install.
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.23",
  "pyarrow>=14",
  "requests>=2.31,<2.33",  # google-colab pins requests==2.32.4; do not exceed
  "PyYAML>=6.0",
  "yfinance>=0.2.40",
  "ccxt>=4.2",
]

[project.optional-dependencies]
backtest = ["vectorbt>=1.0", "backtrader>=1.9.78"]
pipeline = ["google-api-python-client>=2.120", "google-auth>=2.28"]
dev = ["pytest>=8.0", "ruff>=0.4", "jupytext>=1.16", "nbconvert>=7.0", "ipykernel>=6.29"]

[tool.setuptools]
packages = ["tudquant", "tudquant.sources"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
